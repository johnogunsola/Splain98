<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#008080">
    <meta name="description"
        content="Step inside Splain 98, John Ogunsola's retro desktop portfolio. Explore computing, web development, and creative work.">
    <title>Splain 98 — John Ogunsola</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <defs>
            <symbol id="computer" viewBox="0 0 32 32">
                <path fill="#000" d="M3 1h25v22H18v3h12v5H1v-5h11v-3H3z" />
                <path fill="#c0c0c0" d="M4 2h23v20H4zM13 22h4v5h12v3H2v-3h11z" />
                <path fill="#fff" d="M4 2h23v2H6v17H4zM2 27h27v1H2z" />
                <path fill="#808080" d="M7 5h17v14H7z" />
                <path fill="#000080" d="M8 6h15v12H8z" />
                <path fill="#008080" d="M9 7h13v9H9z" />
                <path fill="#00ffff" d="M9 7h13v2H9zM9 9h3v5H9z" />
                <path fill="#fff" d="M21 20h2v1h-2z" />
                <path fill="#808080" d="M5 29h16v1H5z" />
            </symbol>
            <symbol id="folder" viewBox="0 0 32 32">
                <path fill="#000" d="M1 7h12l3 3h14v19H1z" />
                <path fill="#ffff80" d="M2 8h10l3 3h14v16H2z" />
                <path fill="#808000" d="M2 12h27v16H2z" />
                <path fill="#000" d="M6 14h26l-5 15H1z" />
                <path fill="#ffff80" d="M7 15h24l-5 13H2z" />
                <path fill="#fff" d="M7 15h24v1H7z" />
                <path fill="#c0a040" d="M4 26h23l-1 2H3z" />
            </symbol>
            <symbol id="note" viewBox="0 0 32 32">
                <path fill="#000" d="M4 2h20l5 5v24H4z" />
                <path fill="#fff" d="M5 3h18v6h5v21H5z" />
                <path fill="#c0c0c0" d="M24 4v4h4zM8 12h17v1H8zM8 16h17v1H8zM8 20h14v1H8zM8 24h17v1H8z" />
                <path fill="#000080" d="M1 3h3v3H1zM1 9h3v3H1zM1 15h3v3H1zM1 21h3v3H1zM1 27h3v3H1z" />
            </symbol>
            <symbol id="mail" viewBox="0 0 32 32">
                <path fill="#000" d="M1 8h30v21H1z" />
                <path fill="#fff" d="M2 9h28v18H2z" />
                <path fill="#c0c0c0" d="M3 10h26v16H3z" />
                <path fill="none" stroke="#808080" d="m2 10 14 10L30 10M2 27l10-10m8 0 10 10" />
                <path fill="#ffff80" d="M23 10h5v5h-5z" />
            </symbol>
            <symbol id="bin" viewBox="0 0 32 32">
                <path fill="#000" d="M6 8h22l-3 22H9zM5 4h23v5H5zM12 1h10v3H12z" />
                <path fill="#c0c0c0" d="M7 9h20l-3 20H10zM6 5h21v3H6z" />
                <path fill="#fff" d="M7 9h4l2 20h-3zM6 5h21v1H6z" />
                <path fill="#808080" d="M23 9h3l-3 19h-2z" />
                <path fill="none" stroke="#008080" stroke-width="2" d="m14 14 3-3 3 3m1 2 2 4-4 1m-3 1-4-1 1-4" />
            </symbol>
            <symbol id="tools" viewBox="0 0 32 32">
                <path fill="#000" d="M2 4h27v25H2z" />
                <path fill="#c0c0c0" d="M3 5h25v23H3z" />
                <path fill="#fff" d="M3 5h25v2H5v21H3z" />
                <path fill="#000080" d="M6 9h19v4H6z" />
                <path fill="#808080" d="M7 16h17v2H7zM7 22h17v2H7z" />
                <path fill="#fff" stroke="#000" d="M11 14h4v6h-4zM19 20h4v6h-4z" />
            </symbol>
            <symbol id="globe" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="14" fill="#000" />
                <circle cx="16" cy="16" r="13" fill="#0000a8" />
                <path fill="#00a850" d="m8 5 8-2 2 5-5 3-1 5-5-1-4-5zM16 18l5-3 7 3-3 7-5 3-2-5z" />
                <ellipse cx="16" cy="16" rx="7" ry="13" fill="none" stroke="#00ffff" />
                <path fill="none" stroke="#00ffff" d="M3 16h26M6 8h20M6 24h20" />
                <path fill="#fff" d="M9 5h3v3H9z" />
            </symbol>
            <symbol id="flag" viewBox="0 0 32 32">
                <path fill="#000" d="m6 5 11-3 14 4-5 23-13-4-12 3z" />
                <path fill="#f34e25" d="m9 6 8-2-2 10-8 1z" />
                <path fill="#7fbd25" d="m19 4 10 3-2 10-10-3z" />
                <path fill="#2196eb" d="m7 17 8-1-2 8-8 2z" />
                <path fill="#ffd638" d="m17 16 10 3-2 8-10-3z" />
                <path fill="#000" d="M0 7h3v3H0zM1 13h3v3H1zM0 20h3v3H0z" />
            </symbol>
            <symbol id="terminal" viewBox="0 0 32 32">
                <path fill="#000" d="M1 4h30v25H1z" />
                <path fill="#c0c0c0" d="M2 5h28v23H2z" />
                <path fill="#000080" d="M3 6h26v3H3z" />
                <path fill="#000" d="M4 11h24v14H4z" />
                <path stroke="#fff" fill="none" d="m6 15 3 3-3 3m5 0h6" />
            </symbol>
        </defs>
    </svg>
    <main id="desktop" aria-label="Splain 98 desktop">
        <nav class="desktop-icons" aria-label="Desktop applications"></nav>
        <div class="desktop-brand" aria-hidden="true"><span>PERSONAL
                COMPUTER</span><strong>Splain<span>98</span></strong><small>Built for a different kind of
                window.</small></div>
        <div id="windows"></div>
        <div class="desktop-tip">A little nostalgia. A lot of possibility.<br><span>Click an icon. Make yourself at
                home.</span></div>
    </main>
    <div id="start-menu" class="raised" hidden>
        <div class="start-rail">Splain<span>98</span></div>
        <div class="start-items">
            <div class="start-user">John's personal computer</div><button data-open="welcome"><svg>
                    <use href="#flag" />
                </svg><b>Welcome</b></button><button data-open="projects"><svg>
                    <use href="#folder" />
                </svg>My Projects <span>▶</span></button><button data-open="about"><svg>
                    <use href="#computer" />
                </svg>About Me</button><button data-open="skills"><svg>
                    <use href="#terminal" />
                </svg>My Skills</button>
            <hr><button data-open="settings"><svg>
                    <use href="#tools" />
                </svg>Settings</button><button data-open="contact"><svg>
                    <use href="#mail" />
                </svg>Connect</button>
            <hr><button id="shutdown"><svg>
                    <use href="#flag" />
                </svg>Shut Down…</button>
        </div>
    </div>
    <footer class="taskbar"><button id="start" class="raised" aria-expanded="false"><svg>
                <use href="#flag" />
            </svg><b>Start</b></button>
        <div class="task-separator"></div><button class="quick-launch" id="show-desktop" title="Show desktop"
            aria-label="Show desktop"><svg>
                <use href="#computer" />
            </svg></button>
        <div class="task-separator"></div>
        <div id="tasks"></div>
        <div class="tray"><button id="sound" aria-label="Turn sound on" title="Sound off">♪<span>×</span></button><span
                class="tray-light" title="Desktop ready"></span><time id="clock"></time></div>
    </footer>
    <div id="off-screen" hidden><svg>
            <use href="#flag" />
        </svg>
        <h1>It's now safe to close this window.</h1>
        <p>Your ideas will be here when you get back.</p><button class="raised" id="restart">Restart Splain 98</button>
    </div>
    <script src="app.js"></script>
</body>

</html>
